server {
    listen 80;
    server_name mp3.h5cssjs.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mp3.h5cssjs.com;

    ssl_certificate /etc/nginx/ssl/mp3.h5cssjs.com/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/mp3.h5cssjs.com/mp3.h5cssjs.com.key;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 5m;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /opt/kit;
    index index.html;

    location /thttt/ {
        proxy_pass https://www.thttt.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host www.thttt.com;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Referer https://www.thttt.com/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect https://www.thttt.com/ /thttt/;
        proxy_redirect http://www.thttt.com/ /thttt/;
    }

    location = /audio-proxy {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
